<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>WC 2026 Draft</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<style>
/* ─── TOKENS ─────────────────────────────────────────────── */
:root{
  --bg:        #0b0f19;
  --surf:      #131929;
  --surf2:     #1a2236;
  --surf3:     #202b40;
  --border:    rgba(255,255,255,0.1);
  --border2:   rgba(255,255,255,0.06);
  --accent:    #4f8ef7;
  --accent-hi: #7fb3ff;
  --green:     #34d399;
  --red:       #f87171;
  --amber:     #fbbf24;
  /* TEXT — only two grades: primary white and secondary grey */
  --t1: #ffffff;
  --t2: #8fa3bf;
  --t3: #4d6380;
  --r:  14px;
  --rl: 18px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{min-height:100%;background:var(--bg);}
body{font-family:'Outfit',sans-serif;color:var(--t1);line-height:1.5;font-size:16px;}
::-webkit-scrollbar{width:5px;}
::-webkit-scrollbar-thumb{background:var(--surf3);border-radius:4px;}

/* ─── APP SHELL ──────────────────────────────────────────── */
#app{min-height:100vh;padding-bottom:80px;}

/* ─── HEADER ─────────────────────────────────────────────── */
#header{
  background:var(--surf);
  border-bottom:1px solid var(--border2);
  padding:0.9rem 1.5rem;
  position:sticky;top:0;z-index:50;
  display:flex;align-items:center;justify-content:space-between;gap:1rem;
}
.hdr-left{display:flex;align-items:center;gap:0.8rem;}
.hdr-ball{font-size:1.7rem;line-height:1;}
.hdr-title{font-size:1.15rem;font-weight:800;color:var(--t1);letter-spacing:-0.02em;line-height:1.1;}
.hdr-sub{font-size:0.65rem;font-weight:600;color:var(--t2);letter-spacing:0.12em;text-transform:uppercase;margin-top:1px;}

#sync-pill{
  display:flex;align-items:center;gap:7px;
  background:var(--surf2);border:1px solid var(--border);
  border-radius:99px;padding:0.32rem 0.85rem;
  font-size:0.75rem;font-weight:600;color:var(--t1);
  white-space:nowrap;flex-shrink:0;
}
.dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.dot.live{background:var(--green);box-shadow:0 0 8px var(--green);}
.dot.error{background:var(--red);}
.dot.syncing{background:var(--amber);animation:blink 0.9s ease-in-out infinite;}

/* ─── NAV ────────────────────────────────────────────────── */
#nav{
  position:fixed;bottom:0;left:0;right:0;z-index:100;
  background:var(--surf);border-top:1px solid var(--border2);
  display:flex;
}
.nav-btn{
  flex:1;padding:0.65rem 0.5rem 0.55rem;
  background:none;border:none;border-top:2px solid transparent;
  color:var(--t3);font-size:0.62rem;font-weight:700;
  font-family:'Outfit',sans-serif;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  letter-spacing:0.08em;text-transform:uppercase;
  transition:color 0.15s,border-color 0.15s;
}
.nav-btn.active{color:#ffffff;border-top-color:#4f8ef7;}
.nav-icon{font-size:1.2rem;}

/* ─── VIEWS ──────────────────────────────────────────────── */
.view{display:none;padding:1.5rem;max-width:1200px;margin:0 auto;}
.view.active{display:block;}

/* ─── PAGE HEADER ────────────────────────────────────────── */
.pg-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:1.25rem;gap:1rem;flex-wrap:wrap;}
.pg-title{font-size:1.5rem;font-weight:800;color:var(--t1);letter-spacing:-0.025em;}
.pg-sub{font-size:0.78rem;font-weight:500;color:var(--t2);}

/* ─── GRID ───────────────────────────────────────────────── */
.grid{display:grid;grid-template-columns:1fr;gap:0.75rem;}
@media(min-width:680px){.grid{grid-template-columns:repeat(2,1fr);}}

/* ─── CARD ───────────────────────────────────────────────── */
.card{
  background:var(--surf);border:1px solid var(--border2);
  border-radius:var(--rl);padding:1.1rem 1.2rem;
  transition:border-color 0.15s;
}
.card.top1{
  background:linear-gradient(135deg,rgba(79,142,247,0.12) 0%,var(--surf) 60%);
  border-color:rgba(79,142,247,0.35);
}

/* ─── LEADERBOARD ROW ────────────────────────────────────── */
.lb-row{display:flex;align-items:center;gap:1rem;cursor:pointer;}
.lb-rank{width:42px;text-align:center;flex-shrink:0;}
.lb-medal{font-size:1.6rem;line-height:1;}
.lb-pos{font-size:0.9rem;font-weight:800;color:var(--t2);}
.lb-body{flex:1;min-width:0;}
.lb-name{font-size:1rem;font-weight:700;color:var(--t1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.lb-flags{font-size:1.05rem;margin-top:3px;letter-spacing:0.02em;}
.lb-right{text-align:right;flex-shrink:0;}
.lb-pts{font-size:2rem;font-weight:800;line-height:1;color:var(--t3);font-variant-numeric:tabular-nums;}
.lb-pts.has{color:var(--t1);}
.lb-ptslbl{font-size:0.6rem;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:0.1em;}
.lb-chev{color:var(--t3);font-size:1rem;flex-shrink:0;}

/* ─── POINTS KEY ─────────────────────────────────────────── */
.pts-key{background:var(--surf2);border:1px solid var(--border2);border-radius:var(--r);padding:1rem 1.1rem;margin-top:1.1rem;}
.pts-key-ttl{font-size:0.68rem;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:0.1em;margin-bottom:0.7rem;}
.pts-key-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:0.45rem;}
@media(min-width:500px){.pts-key-grid{grid-template-columns:repeat(6,1fr);}}
.pts-key-item{
  background:var(--surf);border:1px solid var(--border2);border-radius:8px;
  padding:0.55rem 0.25rem;display:flex;flex-direction:column;align-items:center;gap:2px;
}
.pki-icon{font-size:1.1rem;}
.pki-pts{font-size:0.82rem;font-weight:800;color:var(--t1);}
.pki-lbl{font-size:0.57rem;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:0.06em;text-align:center;}

/* ─── PERSON SELECTOR ────────────────────────────────────── */
.psn-btn{
  width:100%;display:flex;justify-content:space-between;align-items:center;
  background:var(--surf);border:1px solid var(--border2);border-radius:var(--r);
  padding:0.9rem 1.1rem;margin-bottom:0.5rem;
  color:var(--t1);font-family:'Outfit',sans-serif;font-size:0.95rem;font-weight:600;
  cursor:pointer;text-align:left;transition:background 0.14s,border-color 0.14s;
}
.psn-btn:hover{background:var(--surf2);border-color:var(--border);}
.psn-pts{font-size:0.85rem;font-weight:700;color:var(--accent-hi);}

/* ─── BACK BUTTON ────────────────────────────────────────── */
.back-btn{
  display:inline-flex;align-items:center;gap:6px;
  background:var(--surf2);border:1px solid var(--border);
  border-radius:8px;padding:0.42rem 0.9rem;
  color:var(--t1);font-family:'Outfit',sans-serif;font-size:0.85rem;font-weight:600;cursor:pointer;
  transition:background 0.14s;
}
.back-btn:hover{background:var(--surf3);}

/* ─── PERSON DETAIL HEADER ───────────────────────────────── */
.psn-header{display:flex;align-items:center;gap:1rem;margin-bottom:1.25rem;flex-wrap:wrap;}
.psn-hdr-name{font-size:1.1rem;font-weight:800;color:var(--t1);}
.psn-hdr-sub{font-size:0.8rem;font-weight:500;color:var(--t2);margin-top:1px;}

/* ─── TEAM CARD (results) ────────────────────────────────── */
.team-card{background:var(--surf);border:1px solid var(--border2);border-radius:var(--rl);padding:1rem 1.1rem;margin-bottom:0.75rem;}
.team-top{display:flex;align-items:center;gap:0.85rem;margin-bottom:0.9rem;}
.team-flag{font-size:2.1rem;line-height:1;flex-shrink:0;}
.team-info{flex:1;min-width:0;}
.team-name{font-size:0.95rem;font-weight:700;color:var(--t1);display:flex;align-items:center;gap:0.4rem;flex-wrap:wrap;}
.team-conf{font-size:0.72rem;font-weight:600;margin-top:2px;}
.bonus-badge{
  font-size:0.58rem;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;
  background:rgba(251,191,36,0.14);color:var(--amber);
  border:1px solid rgba(251,191,36,0.3);border-radius:4px;padding:2px 6px;
}
.team-pts-val{font-size:1.7rem;font-weight:800;line-height:1;color:var(--t3);flex-shrink:0;font-variant-numeric:tabular-nums;}
.team-pts-val.has{color:var(--t1);}

/* ─── STAGE BUTTONS ──────────────────────────────────────── */
.stages-wrap{display:grid;grid-template-columns:repeat(3,1fr);gap:0.45rem;}
@media(min-width:520px){.stages-wrap{grid-template-columns:repeat(6,1fr);}}
.stg{
  padding:0.6rem 0.25rem;border-radius:9px;
  border:1px solid var(--border2);background:var(--surf2);
  color:var(--t2);font-size:0.62rem;font-weight:700;
  font-family:'Outfit',sans-serif;cursor:pointer;
  text-align:center;line-height:1.4;
  transition:all 0.13s;
}
.stg:hover:not(:disabled){background:var(--surf3);border-color:var(--border);color:var(--t1);}
.stg.on{background:rgba(79,142,247,0.16);border-color:rgba(79,142,247,0.5);color:#ffffff;}
.stg.on .stg-pts{color:var(--accent-hi);}
.stg:not(.on) .stg-pts{color:var(--t3);}
.stg:active:not(:disabled){transform:scale(0.94);}
.stg:disabled{opacity:0.3;cursor:not-allowed;}
.stg-icon{font-size:1rem;display:block;}
.stg-lbl{font-size:0.58rem;text-transform:uppercase;letter-spacing:0.04em;}
.stg-pts{font-size:0.65rem;font-weight:800;display:block;}

/* ─── DRAW VIEW ──────────────────────────────────────────── */
.draw-card{background:var(--surf);border:1px solid var(--border2);border-radius:var(--rl);padding:1rem 1.1rem;}
.draw-card-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:0.65rem;}
.draw-name{font-size:0.95rem;font-weight:700;color:var(--t1);}
.draw-pts{font-size:0.8rem;font-weight:700;color:var(--accent-hi);}
.pills{display:flex;flex-wrap:wrap;gap:5px;}
.pill{
  display:inline-flex;align-items:center;gap:4px;
  background:var(--surf2);border:1px solid var(--border2);
  border-radius:6px;padding:3px 9px;
  font-size:0.76rem;font-weight:500;color:var(--t1);
}
.pill.bonus{background:rgba(251,191,36,0.1);border-color:rgba(251,191,36,0.28);color:#fde68a;}

/* ─── INFO BOX ───────────────────────────────────────────── */
.info-box{
  background:rgba(79,142,247,0.08);border:1px solid rgba(79,142,247,0.22);
  border-radius:var(--r);padding:0.9rem 1rem;margin-bottom:1.25rem;
  font-size:0.83rem;color:var(--t1);line-height:1.6;
}
.info-box strong{color:var(--accent-hi);}

/* ─── BUTTONS ────────────────────────────────────────────── */
.btn{
  display:inline-flex;align-items:center;gap:0.5rem;
  padding:0.72rem 1.6rem;border:none;border-radius:99px;
  font-family:'Outfit',sans-serif;font-size:0.9rem;font-weight:700;cursor:pointer;
  transition:opacity 0.15s,background 0.15s;
}
.btn:disabled{opacity:0.35;cursor:not-allowed;}
.btn-blue{background:var(--accent);color:#fff;box-shadow:0 0 20px rgba(79,142,247,0.28);}
.btn-blue:hover:not(:disabled){background:#3a7de8;}
.btn-ghost{background:var(--surf2);color:var(--t1);border:1px solid var(--border);}
.btn-ghost:hover:not(:disabled){background:var(--surf3);}
.btn-red{background:#dc2626;color:#fff;}
.btn-red:hover:not(:disabled){background:#b91c1c;}
.btn-row{display:flex;gap:0.75rem;flex-wrap:wrap;margin-bottom:1.5rem;}

/* ─── EMPTY ──────────────────────────────────────────────── */
.empty{text-align:center;padding:4rem 1rem;}
.empty-icon{font-size:3.5rem;margin-bottom:1rem;}
.empty p{color:var(--t2);margin-bottom:1.5rem;font-size:0.95rem;line-height:1.6;}

/* ─── SKELETON ───────────────────────────────────────────── */
.skel{background:linear-gradient(90deg,var(--surf) 25%,var(--surf2) 50%,var(--surf) 75%);background-size:200% 100%;animation:shimmer 1.4s infinite;border-radius:var(--rl);margin-bottom:0.75rem;}

/* ─── TOAST ──────────────────────────────────────────────── */
#toast{
  position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(14px);
  background:var(--surf2);border:1px solid var(--border);
  border-radius:99px;padding:0.6rem 1.4rem;
  color:var(--t1);font-size:0.88rem;font-weight:600;
  z-index:200;white-space:nowrap;pointer-events:none;
  box-shadow:0 8px 32px rgba(0,0,0,0.6);
  opacity:0;transition:opacity 0.2s,transform 0.2s;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ─── MODAL ──────────────────────────────────────────────── */
#modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.78);z-index:300;align-items:flex-end;justify-content:center;}
#modal-bg.show{display:flex;}
#modal{
  background:var(--surf);border:1px solid var(--border);
  border-radius:20px 20px 0 0;padding:1.75rem 1.5rem;
  width:100%;max-width:520px;animation:up 0.26s ease;
}
#modal h3{font-size:1.1rem;font-weight:800;color:var(--t1);margin-bottom:0.5rem;}
#modal p{font-size:0.88rem;color:var(--t2);margin-bottom:1.5rem;line-height:1.6;}
.mod-btns{display:flex;gap:0.75rem;}
.mod-btns button{flex:1;padding:0.78rem;border-radius:10px;font-family:'Outfit',sans-serif;font-weight:700;font-size:0.9rem;cursor:pointer;}
.mod-c{background:var(--surf2);border:1px solid var(--border);color:var(--t1);}
.mod-d{background:#dc2626;border:none;color:#fff;}

/* ─── ANIMATIONS ─────────────────────────────────────────── */
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes fadeup{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.spin{display:inline-block;animation:spin 0.8s linear infinite;}
.anim{animation:fadeup 0.3s ease both;}
</style>
</head>
<body>
<div id="app">

  <div id="header">
    <div class="hdr-left">
      <div class="hdr-ball">⚽</div>
      <div>
        <div class="hdr-title">WC 2026 Draft</div>
        <div class="hdr-sub">Workplace Leaderboard</div>
      </div>
    </div>
    <div id="sync-pill">
      <span class="dot syncing" id="sync-dot"></span>
      <span id="sync-text">Connecting…</span>
    </div>
  </div>


  <!-- DEBUG PANEL - remove after fixing -->
  <div id="dbg-wrap" style="position:fixed;top:70px;right:0;z-index:999;max-width:340px;background:rgba(0,0,0,0.92);border:1px solid #f87171;border-right:none;border-radius:8px 0 0 8px;padding:0.5rem 0.75rem;font-size:0.65rem;font-family:monospace;color:#34d399;line-height:1.6;max-height:220px;overflow:auto;">
    <div style="color:#f87171;font-weight:700;margin-bottom:4px;">DB DEBUG LOG</div>
    <pre id="dbg" style="margin:0;white-space:pre-wrap;word-break:break-all;"></pre>
  </div>
  <div id="view-leaderboard" class="view active">
    <div id="lb-content">
      <div class="skel" style="height:72px"></div>
      <div class="skel" style="height:72px"></div>
      <div class="skel" style="height:72px"></div>
      <div class="skel" style="height:72px"></div>
    </div>
  </div>
  <div id="view-results" class="view"><div id="res-content"></div></div>
  <div id="view-draw"    class="view"><div id="drw-content"></div></div>

  <div id="toast"></div>

  <nav id="nav">
    <button class="nav-btn active" data-view="leaderboard" onclick="nav('leaderboard')"><span class="nav-icon">🏆</span>Standings</button>
    <button class="nav-btn"        data-view="results"     onclick="nav('results')"    ><span class="nav-icon">⚽</span>Results</button>
    <button class="nav-btn"        data-view="draw"        onclick="nav('draw')"       ><span class="nav-icon">🎲</span>Draw</button>
  </nav>
</div>

<div id="modal-bg" onclick="closeModal()">
  <div id="modal" onclick="event.stopPropagation()">
    <h3>⚠️ Confirm Redraw</h3>
    <p>This will randomly reassign all 48 teams and reset everyone's points to zero. This cannot be undone.</p>
    <div class="mod-btns">
      <button class="mod-c" onclick="closeModal()">Cancel</button>
      <button class="mod-d" onclick="confirmDraw()">Yes, Redraw</button>
    </div>
  </div>
</div>

<script>
/* ── SUPABASE ─────────────────────────────────────────────── */
const SB  = 'https://hblrggrbwodmkesszckk.supabase.co';
const KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhibHJnZ3Jid29kbWtlc3N6Y2trIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA5MTY0NjcsImV4cCI6MjA5NjQ5MjQ2N30.5F-8-D4CfSnmj2jxSlViXL_CBP8a2lDy76J6PJEJymY';
async function q(path, opts){
  const method = (opts?.method || 'GET').toUpperCase();
  const headers = {
    'Content-Type': 'application/json',
    'apikey': KEY,
    'Authorization': 'Bearer ' + KEY,
  };
  if(method === 'POST' || method === 'PATCH') headers['Prefer'] = 'return=representation';
  // Build fetch options explicitly - don't spread opts to avoid header override
  const fetchOpts = { method, headers };
  if(opts?.body) fetchOpts.body = opts.body;
  dbg('→ '+method+' '+path.split('?')[0]);
  const res = await fetch(SB + '/rest/v1/' + path, fetchOpts);
  if(!res.ok){
    const body = await res.text();
    dbg('✗ '+res.status+': '+body.slice(0,120));
    throw new Error(body);
  }
  if(method === 'DELETE') { dbg('✓ deleted'); return []; }
  const txt = await res.text();
  const parsed = txt ? JSON.parse(txt) : [];
  dbg('✓ '+method+' ok'+(Array.isArray(parsed)?' ('+parsed.length+' rows)':''));
  return parsed;
}

// Debug panel - visible in top right corner
const _dbgLines = [];
function dbg(msg){
  const t = new Date().toLocaleTimeString();
  _dbgLines.unshift('['+t+'] '+msg);
  if(_dbgLines.length > 12) _dbgLines.pop();
  const el = document.getElementById('dbg');
  if(el) el.textContent = _dbgLines.join('\n');
}

/* ── FLAG MAP ─────────────────────────────────────────────── */
const FLAGS={
  'United States':'🇺🇸','Canada':'🇨🇦','Mexico':'🇲🇽',
  'England':'🏴󠁧󠁢󠁥󠁮󠁧󠁿','France':'🇫🇷','Spain':'🇪🇸','Germany':'🇩🇪','Portugal':'🇵🇹',
  'Netherlands':'🇳🇱','Belgium':'🇧🇪','Croatia':'🇭🇷','Switzerland':'🇨🇭','Austria':'🇦🇹',
  'Scotland':'🏴󠁧󠁢󠁳󠁣󠁴󠁿','Norway':'🇳🇴','Türkiye':'🇹🇷','Sweden':'🇸🇪','Czechia':'🇨🇿','Bosnia & Herz.':'🇧🇦',
  'Argentina':'🇦🇷','Brazil':'🇧🇷','Uruguay':'🇺🇾','Colombia':'🇨🇴','Ecuador':'🇪🇨','Paraguay':'🇵🇾',
  'Morocco':'🇲🇦','Senegal':'🇸🇳','Egypt':'🇪🇬','Algeria':'🇩🇿','Ghana':'🇬🇭',
  "Côte d'Ivoire":'🇨🇮','Tunisia':'🇹🇳','South Africa':'🇿🇦','Cabo Verde':'🇨🇻','DR Congo':'🇨🇩',
  'Japan':'🇯🇵','South Korea':'🇰🇷','Iran':'🇮🇷','Saudi Arabia':'🇸🇦','Australia':'🇦🇺',
  'Qatar':'🇶🇦','Jordan':'🇯🇴','Uzbekistan':'🇺🇿','Iraq':'🇮🇶',
  'Panama':'🇵🇦','Honduras':'🇭🇳','Jamaica':'🇯🇲','New Zealand':'🇳🇿',
};
// Try hardcoded map first, then DB flag column if it looks like emoji (len > 2), else placeholder
function flag(name, dbFlag){
  if(FLAGS[name]) return FLAGS[name];
  if(dbFlag && [...dbFlag].length > 1) return dbFlag;
  return '🏳️';
}

/* ── CONF COLOURS ─────────────────────────────────────────── */
const CC={Host:'#fbbf24',UEFA:'#60a5fa',CONMEBOL:'#34d399',CAF:'#f87171',AFC:'#c084fc',CONCACAF:'#fb923c',OFC:'#22d3ee'};

/* ── STAGE DEFINITIONS ────────────────────────────────────── */
const STAGES=[
  {key:'group', label:'Group Stage',   pts:1,  icon:'🏟️'},
  {key:'r16',   label:'Round of 16',   pts:2,  icon:'⚔️'},
  {key:'qf',    label:'Quarter-Final', pts:3,  icon:'🔥'},
  {key:'sf',    label:'Semi-Final',    pts:5,  icon:'⭐'},
  {key:'final', label:'Final',         pts:8,  icon:'🥈'},
  {key:'winner',label:'Champion',      pts:13, icon:'🏆'},
];
const MEDALS=['🥇','🥈','🥉'];
const ord=n=>n===1?'1st':n===2?'2nd':n===3?'3rd':n+'th';

/* ── STATE ────────────────────────────────────────────────── */
let PP=[],TT=[],PK=[],PR=[];
let view='leaderboard',epid=null,busy=false;

/* ── STATUS ───────────────────────────────────────────────── */
function status(s,t){
  document.getElementById('sync-dot').className='dot '+s;
  const el=document.getElementById('sync-text');
  el.textContent=t;
  el.style.color=s==='live'?'#34d399':s==='error'?'#f87171':'#fbbf24';
}

/* ── LOAD ─────────────────────────────────────────────────── */
async function load(){
  status('syncing','Loading…');
  try{
    [PP,TT,PK,PR]=await Promise.all([
      q('participants?order=name'),
      q('teams?order=name'),
      q('draft_picks?select=*'),
      q('team_progress?select=*'),
    ]);
    status('live','Live');
    renderAll();
  }catch(e){
    status('error','Connection failed');
    document.getElementById('lb-content').innerHTML=
      `<div class="empty"><div class="empty-icon">⚠️</div><p>Could not reach the database.<br>Make sure your Supabase project is active.</p></div>`;
  }
}
setInterval(async()=>{
  if(busy)return;
  try{
    const[p2,pg2]=await Promise.all([q('draft_picks?select=*'),q('team_progress?select=*')]);
    PK=p2;PR=pg2;status('live','Live');
    renderLB();
    if(view==='results'&&epid)renderDetail(epid);
    if(view==='draw')renderDraw();
  }catch{status('error','Sync error');}
},20000);

/* ── HELPERS ──────────────────────────────────────────────── */
const byId=(a,id)=>a.find(x=>x.id===id);
const picksFor=pid=>PK.filter(p=>p.participant_id===pid);
const progFor=tid=>PR.filter(p=>p.team_id===tid).map(p=>p.stage_key);
const tpts=tid=>STAGES.reduce((s,st)=>s+(progFor(tid).includes(st.key)?st.pts:0),0);
const ppts=pid=>picksFor(pid).reduce((s,pk)=>s+tpts(pk.team_id),0);
const shuf=a=>{const b=[...a];for(let i=b.length-1;i>0;i--){const j=0|Math.random()*(i+1);[b[i],b[j]]=[b[j],b[i]];}return b;};

function lb(){
  const s=[...PP].map(p=>({...p,pts:ppts(p.id)})).sort((a,b)=>b.pts-a.pts);
  let r=1;return s.map((p,i)=>{if(i>0&&s[i].pts<s[i-1].pts)r=i+1;return{...p,rank:r};});
}

/* ── TOAST ────────────────────────────────────────────────── */
let _tt;
function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg;el.classList.add('show');
  clearTimeout(_tt);_tt=setTimeout(()=>el.classList.remove('show'),2800);
}

/* ── NAV ──────────────────────────────────────────────────── */
function nav(v){
  view=v;if(v!=='results')epid=null;
  document.querySelectorAll('.view').forEach(el=>el.classList.remove('active'));
  document.getElementById('view-'+v).classList.add('active');
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.view===v));
  renderAll();
}

/* ── DRAW ─────────────────────────────────────────────────── */
function askDraw(){PK.length?document.getElementById('modal-bg').classList.add('show'):confirmDraw();}
function closeModal(){document.getElementById('modal-bg').classList.remove('show');}

async function confirmDraw(){
  closeModal();busy=true;status('syncing','Drawing…');
  const btn=document.getElementById('draw-btn');
  if(btn){btn.disabled=true;btn.innerHTML='<span class="spin">⚽</span> Drawing…';}
  try{
    await q('team_progress?id=gt.0',{method:'DELETE'});
    await q('draft_picks?id=gt.0',  {method:'DELETE'});

    const n=PP.length;
    const sh=shuf([...TT]);
    const per=Math.floor(sh.length/n);
    const ins=[];

    /* base picks */
    const slots=PP.map((p,i)=>({p,teams:sh.slice(i*per,(i+1)*per)}));
    slots.forEach(({p,teams})=>teams.forEach(t=>ins.push({participant_id:p.id,team_id:t.id,is_bonus:false})));

    /* fair bonus: leftovers go to weakest draws */
    const strong=new Set(['UEFA','CONMEBOL','Host']);
    const leftovers=sh.slice(n*per);
    if(leftovers.length){
      const scored=slots.map(({p,teams},i)=>({i,score:teams.filter(t=>strong.has(t.confederation)).length}))
                        .sort((a,b)=>a.score-b.score);
      leftovers.forEach((t,j)=>ins.push({participant_id:PP[scored[j].i].id,team_id:t.id,is_bonus:true}));
    }

    PK=await q('draft_picks',{method:'POST',body:JSON.stringify(ins)});
    PR=[];status('live','Live');toast('✅ Draw complete — good luck everyone!');renderAll();
  }catch(e){
    status('error','Draw failed');toast('❌ Draw failed — see console');console.error(e);
  }finally{busy=false;}
}

/* ── TOGGLE STAGE ─────────────────────────────────────────── */
async function toggleStage(tid,sk){
  const si=STAGES.findIndex(s=>s.key===sk);
  const stage=STAGES[si];
  const reached=progFor(tid);
  const isOn=reached.includes(sk);
  document.querySelectorAll('.tm'+tid).forEach(b=>b.disabled=true);
  try{
    if(!isOn){
      const add=STAGES.slice(0,si+1).filter(s=>!reached.includes(s.key)).map(s=>({team_id:tid,stage_key:s.key}));
      if(add.length){const r=await q('team_progress',{method:'POST',body:JSON.stringify(add)});PR=[...PR,...r];}
      toast(`${stage.icon} ${byId(TT,tid)?.name} — +${stage.pts}pt`);
    }else{
      const rem=STAGES.slice(si).map(s=>s.key);
      await q(`team_progress?team_id=eq.${tid}&stage_key=in.(${rem.join(',')})`,{method:'DELETE'});
      PR=PR.filter(p=>!(p.team_id===tid&&rem.includes(p.stage_key)));
    }
    renderStages(tid);
    const pts=tpts(tid);
    const el=document.getElementById('tp'+tid);
    if(el){el.textContent=pts+'pt';el.className='team-pts-val'+(pts>0?' has':'');}
    if(epid){const e=document.getElementById('psub');if(e)e.textContent=ppts(epid)+' pts total';}
    renderLB();
  }catch(e){
    console.error('toggleStage error:', e);
    toast('❌ '+( e.message.includes('RLS')||e.message.includes('policy')||e.message.includes('permission')
      ? 'Permission denied — disable RLS in Supabase for team_progress table'
      : 'Save failed: '+e.message.slice(0,80)));
  }finally{
    document.querySelectorAll('.tm'+tid).forEach(b=>b.disabled=false);
  }
}

function renderStages(tid){
  const el=document.getElementById('st'+tid);if(!el)return;
  const reached=progFor(tid);
  el.innerHTML=STAGES.map(s=>{
    const on=reached.includes(s.key);
    return `<button class="stg${on?' on':''} tm${tid}" onclick="toggleStage(${tid},${JSON.stringify(s.key)})">
      <span class="stg-icon">${s.icon}</span>
      <span class="stg-lbl">${s.label.split(' ').pop()}</span>
      <span class="stg-pts">+${s.pts}pt</span>
    </button>`;
  }).join('');
}

/* ── RENDER: LEADERBOARD ──────────────────────────────────── */
function renderLB(){
  const el=document.getElementById('lb-content');if(!el)return;
  if(!PK.length){
    el.innerHTML=`<div class="empty"><div class="empty-icon">⚽</div><p>No draw yet — head to the Draw tab to get started.</p><button class="btn btn-blue" onclick="nav('draw')">Go to Draw</button></div>`;
    return;
  }
  const rows=lb();
  let h=`<div class="pg-head"><span class="pg-title">Standings</span><span class="pg-sub">${PP.length} players · ${TT.length} teams</span></div>
  <div class="grid">`;
  rows.forEach((p,i)=>{
    const mypicks=picksFor(p.id);
    const flagStr=mypicks.slice(0,6).map(pk=>{const t=byId(TT,pk.team_id);return flag(t?.name||'',t?.flag)}).join(' ')
      +(mypicks.length>6?` <span style="color:var(--t3);font-size:0.78rem">+${mypicks.length-6}</span>`:'');
    const isTop=p.rank===1&&p.pts>0;
    const rankHtml=p.rank<=3
      ?`<div class="lb-rank"><span class="lb-medal">${MEDALS[p.rank-1]}</span></div>`
      :`<div class="lb-rank"><span class="lb-pos">${ord(p.rank)}</span></div>`;
    const[first,...rest]=p.name.split(' ');
    h+=`<div class="card${isTop?' top1':''} anim" style="animation-delay:${i*0.035}s">
      <div class="lb-row" onclick="goTo(${p.id})">
        ${rankHtml}
        <div class="lb-body">
          <div class="lb-name">${first} <span style="color:var(--t2);font-weight:500">${rest.join(' ')}</span></div>
          <div class="lb-flags">${flagStr}</div>
        </div>
        <div class="lb-right">
          <div class="lb-pts${p.pts>0?' has':''}">${p.pts}</div>
          <div class="lb-ptslbl">pts</div>
        </div>
        <div class="lb-chev">›</div>
      </div>
    </div>`;
  });
  h+=`</div>
  <div class="pts-key">
    <div class="pts-key-ttl">Points per stage</div>
    <div class="pts-key-grid">
      ${STAGES.map(s=>`<div class="pts-key-item">
        <span class="pki-icon">${s.icon}</span>
        <span class="pki-pts">${s.pts}pt</span>
        <span class="pki-lbl">${s.label.split(' ').pop()}</span>
      </div>`).join('')}
    </div>
  </div>`;
  el.innerHTML=h;
}

/* ── RENDER: RESULTS ──────────────────────────────────────── */
function goTo(id){epid=id;nav('results');}

function renderRes(){
  const el=document.getElementById('res-content');if(!el)return;
  if(!PK.length){
    el.innerHTML=`<div class="empty"><div class="empty-icon">🎲</div><p>Run the draw first!</p><button class="btn btn-blue" onclick="nav('draw')">Go to Draw</button></div>`;
    return;
  }
  if(!epid){
    const rows=lb();
    let h=`<div class="pg-head"><span class="pg-title">Update Results</span></div>
      <p style="font-size:0.88rem;color:var(--t2);margin-bottom:1rem;line-height:1.6">Select a player to mark their teams' progress through the tournament.</p>`;
    rows.forEach(p=>{
      h+=`<button class="psn-btn" onclick="goTo(${p.id})">
        <span>${p.name}</span>
        <span class="psn-pts">${p.pts} pts ›</span>
      </button>`;
    });
    el.innerHTML=h;return;
  }
  renderDetail(epid);
}

function renderDetail(pid){
  const el=document.getElementById('res-content');if(!el)return;
  const person=byId(PP,pid);
  if(!person){epid=null;renderRes();return;}
  const mypicks=picksFor(pid);
  const total=ppts(pid);
  let h=`<div class="psn-header">
    <button class="back-btn" onclick="epid=null;renderRes()">← Back</button>
    <div>
      <div class="psn-hdr-name">${person.name}</div>
      <div class="psn-hdr-sub" id="psub">${total} pts total · ${mypicks.length} teams</div>
    </div>
  </div>`;
  mypicks.forEach(pk=>{
    const t=byId(TT,pk.team_id);if(!t)return;
    const pts=tpts(t.id);
    h+=`<div class="team-card">
      <div class="team-top">
        <span class="team-flag">${flag(t.name, t.flag)}</span>
        <div class="team-info">
          <div class="team-name">${t.name}${pk.is_bonus?'<span class="bonus-badge">Bonus</span>':''}</div>
          <div class="team-conf" style="color:${CC[t.confederation]||'var(--t2)'}">${t.confederation}</div>
        </div>
        <div id="tp${t.id}" class="team-pts-val${pts>0?' has':''}">${pts}pt</div>
      </div>
      <div id="st${t.id}" class="stages-wrap"></div>
    </div>`;
  });
  el.innerHTML=h;
  mypicks.forEach(pk=>renderStages(pk.team_id));
}

/* ── RENDER: DRAW ─────────────────────────────────────────── */
function renderDraw(){
  const el=document.getElementById('drw-content');if(!el)return;
  const n=PP.length,per=Math.floor(TT.length/n),extra=TT.length%n;
  let h=`<div class="pg-head"><span class="pg-title">The Draw</span></div>`;
  if(!PK.length){
    h+=`<div class="info-box"><strong>Fair bonus rule:</strong> Each player gets ${per} teams. The ${extra} leftover teams go to whoever has the weakest draw (fewest UEFA / CONMEBOL / Host teams), giving them a slight edge to compensate.</div>`;
  }
  h+=`<div class="btn-row">
    <button id="draw-btn" class="btn btn-blue" onclick="askDraw()">
      ${PK.length?'🔄 Redraw':'🎲 Draw Teams Now'}
    </button>
    ${PK.length?'<button class="btn btn-ghost" onclick="nav(\'results\')">⚽ Enter Results</button>':''}
  </div>`;
  if(PK.length){
    h+=`<div class="grid">`;
    PP.forEach(p=>{
      const mypicks=picksFor(p.id);const pts=ppts(p.id);
      h+=`<div class="draw-card">
        <div class="draw-card-head">
          <span class="draw-name">${p.name}</span>
          <span class="draw-pts">${pts} pts</span>
        </div>
        <div class="pills">
          ${mypicks.map(pk=>{const t=byId(TT,pk.team_id);return t?`<span class="pill${pk.is_bonus?' bonus':''}">${flag(t.name,t.flag)} ${t.name}${pk.is_bonus?' ⭐':''}</span>`:''}).join('')}
        </div>
      </div>`;
    });
    h+=`</div>`;
  }
  el.innerHTML=h;
}

/* ── RENDER ALL ───────────────────────────────────────────── */
function renderAll(){
  renderLB();
  if(view==='results')renderRes();
  if(view==='draw')   renderDraw();
}

load();
</script>
</body>
</html>
