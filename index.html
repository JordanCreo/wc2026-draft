<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>WC 2026 Draft</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#0b0f19; --surf:#131929; --surf2:#1a2236; --surf3:#202b40;
  --border:rgba(255,255,255,0.1); --border2:rgba(255,255,255,0.06);
  --accent:#4f8ef7; --green:#34d399; --red:#f87171; --amber:#fbbf24;
  --t1:#ffffff; --t2:#a0aec0; --t3:#6b7280;
  --r:14px; --rl:18px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{min-height:100%;background:var(--bg);}
body{font-family:'Outfit',sans-serif;color:var(--t1);line-height:1.5;}
::-webkit-scrollbar{width:5px;}
::-webkit-scrollbar-thumb{background:var(--surf3);border-radius:4px;}
#app{min-height:100vh;padding-bottom:80px;}

/* HEADER */
#header{background:var(--surf);border-bottom:1px solid var(--border2);padding:0.9rem 1.5rem;
  position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:1rem;}
.hdr-l{display:flex;align-items:center;gap:0.8rem;}
.hdr-title{font-size:1.15rem;font-weight:800;color:var(--t1);letter-spacing:-0.02em;line-height:1.1;}
.hdr-sub{font-size:0.65rem;font-weight:600;color:rgba(255,255,255,0.5);letter-spacing:0.12em;text-transform:uppercase;}
#sync-pill{display:flex;align-items:center;gap:7px;background:var(--surf2);border:1px solid var(--border);
  border-radius:99px;padding:0.32rem 0.85rem;font-size:0.75rem;font-weight:600;color:var(--t1);white-space:nowrap;}
.dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.dot.live{background:var(--green);box-shadow:0 0 8px var(--green);}
.dot.err{background:var(--red);}
.dot.sync{background:var(--amber);animation:blink 0.9s ease-in-out infinite;}

/* NAV */
#nav{position:fixed;bottom:0;left:0;right:0;z-index:100;background:var(--surf);border-top:1px solid var(--border2);display:flex;}
.nb{flex:1;padding:0.65rem 0.5rem 0.55rem;background:none;border:none;border-top:2px solid transparent;
  color:rgba(255,255,255,0.4);font-size:0.62rem;font-weight:500;font-family:'Outfit',sans-serif;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:3px;letter-spacing:0.08em;text-transform:uppercase;
  transition:color 0.15s,border-color 0.15s;}
.nb.on{color:#ffffff;border-top-color:var(--accent);font-weight:700;}
.ni{font-size:1.2rem;}

/* VIEWS */
.view{display:none;padding:1.5rem;max-width:1200px;margin:0 auto;}
.view.on{display:block;}

/* PAGE HEAD */
.ph{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:1.25rem;gap:1rem;flex-wrap:wrap;}
.pt{font-size:1.5rem;font-weight:800;color:#fff;letter-spacing:-0.025em;}
.ps{font-size:0.78rem;font-weight:500;color:rgba(255,255,255,0.55);}

/* GRID */
.grid{display:grid;grid-template-columns:1fr;gap:0.75rem;}
@media(min-width:680px){.grid{grid-template-columns:repeat(2,1fr);}}

/* CARD */
.card{background:var(--surf);border:1px solid var(--border2);border-radius:var(--rl);padding:1.1rem 1.2rem;}
.card.top{background:linear-gradient(135deg,rgba(79,142,247,0.12),var(--surf));border-color:rgba(79,142,247,0.35);}

/* LEADERBOARD */
.lbr{display:flex;align-items:center;gap:1rem;cursor:pointer;}
.lbrank{width:42px;text-align:center;flex-shrink:0;}
.lbmed{font-size:1.6rem;line-height:1;}
.lbpos{font-size:0.9rem;font-weight:800;color:rgba(255,255,255,0.7);}
.lbbody{flex:1;min-width:0;}
.lbname{font-size:1rem;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.lbname span{color:rgba(255,255,255,0.6);font-weight:500;}
.lbflags{margin-top:5px;display:flex;flex-wrap:wrap;gap:3px;}
.lbr-right{text-align:right;flex-shrink:0;}
.lbpts{font-size:2rem;font-weight:800;line-height:1;color:var(--t3);}
.lbpts.on{color:#fff;}
.lbptsl{font-size:0.6rem;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:0.1em;}
.lbchev{color:var(--t3);font-size:1rem;flex-shrink:0;}

/* FLAG PILL (leaderboard) */
.fpill{display:inline-flex;align-items:center;gap:4px;background:rgba(255,255,255,0.07);
  border:1px solid rgba(255,255,255,0.1);border-radius:5px;padding:2px 7px;
  font-size:0.7rem;font-weight:600;color:#fff;white-space:nowrap;}

/* POINTS KEY */
.pk{background:var(--surf2);border:1px solid var(--border2);border-radius:var(--r);padding:1rem 1.1rem;margin-top:1.1rem;}
.pkt{font-size:0.68rem;font-weight:700;color:rgba(255,255,255,0.55);text-transform:uppercase;letter-spacing:0.1em;margin-bottom:0.7rem;}
.pkg{display:grid;grid-template-columns:repeat(3,1fr);gap:0.45rem;}
@media(min-width:500px){.pkg{grid-template-columns:repeat(6,1fr);}}
.pki{background:var(--surf);border:1px solid var(--border2);border-radius:8px;padding:0.55rem 0.25rem;
  display:flex;flex-direction:column;align-items:center;gap:2px;}
.pkii{font-size:1.1rem;}
.pkip{font-size:0.82rem;font-weight:800;color:#fff;}
.pkil{font-size:0.57rem;font-weight:700;color:rgba(255,255,255,0.55);text-transform:uppercase;letter-spacing:0.06em;text-align:center;}

/* PERSON LIST */
.psnbtn{width:100%;display:flex;justify-content:space-between;align-items:center;
  background:var(--surf);border:1px solid var(--border2);border-radius:var(--r);
  padding:0.9rem 1.1rem;margin-bottom:0.5rem;color:#fff;
  font-family:'Outfit',sans-serif;font-size:0.95rem;font-weight:600;cursor:pointer;text-align:left;}
.psnbtn:hover{background:var(--surf2);}
.psnpts{font-size:0.85rem;font-weight:700;color:var(--accent);}

/* BACK */
.back{display:inline-flex;align-items:center;gap:6px;background:var(--surf2);border:1px solid var(--border);
  border-radius:8px;padding:0.42rem 0.9rem;color:#fff;font-family:'Outfit',sans-serif;font-size:0.85rem;font-weight:600;cursor:pointer;}
.back:hover{background:var(--surf3);}

/* PERSON HEADER */
.psnhdr{display:flex;align-items:center;gap:1rem;margin-bottom:1.25rem;flex-wrap:wrap;}
.psnname{font-size:1.1rem;font-weight:800;color:#fff;}
.psnsub{font-size:0.8rem;font-weight:500;color:rgba(255,255,255,0.55);margin-top:1px;}

/* TEAM CARD */
.tc{background:var(--surf);border:1px solid var(--border2);border-radius:var(--rl);padding:1rem 1.1rem;margin-bottom:0.75rem;}
.tctop{display:flex;align-items:center;gap:0.85rem;margin-bottom:0.9rem;}
.tcflag{line-height:1;flex-shrink:0;display:flex;align-items:center;}
.tcinfo{flex:1;min-width:0;}
.tcname{font-size:0.95rem;font-weight:700;color:#fff;display:flex;align-items:center;gap:0.4rem;flex-wrap:wrap;}
.tcconf{font-size:0.72rem;font-weight:600;margin-top:2px;}
.bonus{font-size:0.58rem;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;
  background:rgba(251,191,36,0.14);color:var(--amber);border:1px solid rgba(251,191,36,0.3);border-radius:4px;padding:2px 6px;}
.tcpts{font-size:1.7rem;font-weight:800;line-height:1;color:var(--t3);flex-shrink:0;}
.tcpts.on{color:#fff;}

/* STAGE BUTTONS */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:0.45rem;}
@media(min-width:520px){.sgrid{grid-template-columns:repeat(6,1fr);}}
.sb{padding:0.6rem 0.25rem;border-radius:9px;border:1px solid var(--border2);background:var(--surf2);
  color:rgba(255,255,255,0.5);font-size:0.62rem;font-weight:700;font-family:'Outfit',sans-serif;
  cursor:pointer;text-align:center;line-height:1.4;transition:all 0.13s;}
.sb:hover:not(:disabled){background:var(--surf3);border-color:var(--border);color:#fff;}
.sb.on{background:rgba(79,142,247,0.16);border-color:rgba(79,142,247,0.5);color:#fff;}
.sb:active:not(:disabled){transform:scale(0.94);}
.sb:disabled{opacity:0.3;cursor:not-allowed;}
.sbi{font-size:1rem;display:block;}
.sbl{font-size:0.58rem;text-transform:uppercase;letter-spacing:0.04em;}
.sbp{font-size:0.65rem;font-weight:800;display:block;color:var(--t3);}
.sb.on .sbp{color:#7fb3ff;}

/* DRAW VIEW */
.dc{background:var(--surf);border:1px solid var(--border2);border-radius:var(--rl);padding:1rem 1.1rem;}
.dch{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:0.65rem;}
.dcn{font-size:0.95rem;font-weight:700;color:#fff;}
.dcp{font-size:0.8rem;font-weight:700;color:var(--accent);}
.pills{display:flex;flex-wrap:wrap;gap:5px;}
.pill{display:inline-flex;align-items:center;gap:4px;background:var(--surf2);border:1px solid var(--border2);
  border-radius:6px;padding:3px 9px;font-size:0.76rem;font-weight:500;color:#fff;}

/* POTS */
.pot-section{margin-bottom:1.5rem;}
.pot-hdr{display:flex;align-items:center;gap:0.75rem;margin-bottom:0.75rem;padding:0.65rem 1rem;border-radius:var(--r);border:1px solid;}
.pot-hdr h3{font-size:0.85rem;font-weight:800;letter-spacing:0.04em;text-transform:uppercase;margin:0;}
.pot-hdr p{font-size:0.72rem;opacity:0.7;margin:2px 0 0;}
.pot-icon{font-size:1.4rem;flex-shrink:0;}
.p1{background:rgba(251,191,36,0.1);border-color:rgba(251,191,36,0.35);color:#fde68a;}
.p2{background:rgba(209,213,219,0.08);border-color:rgba(209,213,219,0.25);color:#e5e7eb;}
.p3{background:rgba(251,146,60,0.08);border-color:rgba(251,146,60,0.3);color:#fed7aa;}
.p4{background:rgba(96,165,250,0.08);border-color:rgba(96,165,250,0.28);color:#bfdbfe;}
.pot-teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:0.45rem;}
.pot-team{background:var(--surf2);border:1px solid var(--border2);border-radius:10px;
  padding:0.55rem 0.75rem;display:flex;align-items:center;gap:0.5rem;font-size:0.8rem;font-weight:600;color:#fff;}

/* INFO BOX */
.info{background:rgba(79,142,247,0.08);border:1px solid rgba(79,142,247,0.22);
  border-radius:var(--r);padding:0.9rem 1rem;margin-bottom:1.25rem;font-size:0.83rem;color:#fff;line-height:1.6;}
.info strong{color:#7fb3ff;}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:0.5rem;padding:0.72rem 1.6rem;border:none;border-radius:99px;
  font-family:'Outfit',sans-serif;font-size:0.9rem;font-weight:700;cursor:pointer;transition:opacity 0.15s;}
.btn:disabled{opacity:0.35;cursor:not-allowed;}
.btn-blue{background:var(--accent);color:#fff;}
.btn-blue:hover:not(:disabled){background:#3a7de8;}
.btn-ghost{background:var(--surf2);color:#fff;border:1px solid var(--border);}
.btn-ghost:hover:not(:disabled){background:var(--surf3);}
.brow{display:flex;gap:0.75rem;flex-wrap:wrap;margin-bottom:1.5rem;}

/* EMPTY */
.empty{text-align:center;padding:4rem 1rem;}
.empty p{color:rgba(255,255,255,0.55);margin-bottom:1.5rem;font-size:0.95rem;}

/* SKELETON */
.skel{background:linear-gradient(90deg,var(--surf) 25%,var(--surf2) 50%,var(--surf) 75%);
  background-size:200% 100%;animation:shimmer 1.4s infinite;border-radius:var(--rl);margin-bottom:0.75rem;}

/* TOAST */
#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(14px);
  background:var(--surf2);border:1px solid var(--border);border-radius:99px;padding:0.6rem 1.4rem;
  color:#fff;font-size:0.88rem;font-weight:600;z-index:200;white-space:nowrap;pointer-events:none;
  box-shadow:0 8px 32px rgba(0,0,0,0.6);opacity:0;transition:opacity 0.2s,transform 0.2s;}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0);}

/* MODAL */
#mbg{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.78);z-index:300;align-items:flex-end;justify-content:center;}
#mbg.on{display:flex;}
#modal{background:var(--surf);border:1px solid var(--border);border-radius:20px 20px 0 0;
  padding:1.75rem 1.5rem;width:100%;max-width:520px;animation:up 0.26s ease;}
#modal h3{font-size:1.1rem;font-weight:800;color:#fff;margin-bottom:0.5rem;}
#modal p{font-size:0.88rem;color:rgba(255,255,255,0.6);margin-bottom:1.5rem;line-height:1.6;}
.mbtns{display:flex;gap:0.75rem;}
.mbtns button{flex:1;padding:0.78rem;border-radius:10px;font-family:'Outfit',sans-serif;font-weight:700;font-size:0.9rem;cursor:pointer;}
.mc{background:var(--surf2);border:1px solid var(--border);color:#fff;}
.md{background:#dc2626;border:none;color:#fff;}

/* DRAW OVERLAY */
#draw-overlay{display:none;position:fixed;inset:0;background:rgba(7,11,22,0.97);z-index:400;
  flex-direction:column;align-items:center;justify-content:center;padding:2rem;overflow-y:auto;}
#draw-overlay.on{display:flex;}
.do-stage-title{font-size:0.72rem;font-weight:700;letter-spacing:0.15em;text-transform:uppercase;
  color:rgba(255,255,255,0.45);margin-bottom:0.4rem;text-align:center;}
.do-pot-label{font-size:1.15rem;font-weight:800;margin-bottom:1.75rem;text-align:center;}
.do-cards{display:flex;flex-wrap:wrap;gap:0.65rem;justify-content:center;max-width:960px;margin-bottom:1.5rem;}
.dpc{background:var(--surf);border:1px solid var(--border);border-radius:var(--rl);
  padding:0.8rem 0.9rem;min-width:130px;text-align:center;transition:all 0.25s;}
.dpc .dpn{font-size:0.78rem;font-weight:700;color:#fff;margin-bottom:0.45rem;line-height:1.3;}
.dpc .dpt{font-size:0.8rem;font-weight:700;color:rgba(255,255,255,0.4);min-height:1.4em;
  display:flex;align-items:center;justify-content:center;gap:5px;}
.dpc.r1{border-color:#fbbf24;background:rgba(251,191,36,0.12);}
.dpc.r2{border-color:#9ca3af;background:rgba(156,163,175,0.1);}
.dpc.r3{border-color:#fb923c;background:rgba(251,146,60,0.1);}
.dpc.r4{border-color:#60a5fa;background:rgba(96,165,250,0.1);}
.dpc.r1 .dpt,.dpc.r2 .dpt,.dpc.r3 .dpt,.dpc.r4 .dpt{color:#fff;}
.do-pips{display:flex;gap:0.5rem;margin-bottom:1.25rem;}
.pip{width:10px;height:10px;border-radius:50%;background:var(--surf3);transition:background 0.3s;}
.pip.done{background:var(--accent);}
.pip.active{background:var(--amber);box-shadow:0 0 8px var(--amber);}
#draw-skip{background:none;border:1px solid rgba(255,255,255,0.18);color:rgba(255,255,255,0.45);
  border-radius:99px;padding:0.45rem 1.2rem;font-family:'Outfit',sans-serif;font-size:0.78rem;cursor:pointer;}
#draw-skip:hover{color:#fff;border-color:rgba(255,255,255,0.4);}

@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes fadeup{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.anim{animation:fadeup 0.3s ease both;}
</style>
</head>
<body>
<div id="app">
  <div id="header">
    <div class="hdr-l">
      <div style="font-size:1.7rem">&#9917;</div>
      <div>
        <div class="hdr-title">WC 2026 Draft</div>
        <div class="hdr-sub">Workplace Leaderboard</div>
      </div>
    </div>
    <div id="sync-pill">
      <span class="dot sync" id="sdot"></span>
      <span id="stxt">Connecting...</span>
    </div>
  </div>

  <div id="view-lb"   class="view on"><div id="lb"><div class="skel" style="height:72px"></div><div class="skel" style="height:72px"></div><div class="skel" style="height:72px"></div></div></div>
  <div id="view-res"  class="view"><div id="res"></div></div>
  <div id="view-draw" class="view"><div id="drw"></div></div>

  <div id="toast"></div>

  <nav id="nav">
    <button class="nb on" data-v="lb"   onclick="go('lb')"  ><span class="ni">&#127942;</span>Standings</button>
    <button class="nb"    data-v="res"  onclick="go('res')" ><span class="ni">&#9917;</span>Results</button>
    <button class="nb"    data-v="draw" onclick="go('draw')"><span class="ni">&#127922;</span>Draw</button>
  </nav>
</div>

<div id="draw-overlay">
  <div class="do-stage-title" id="do-stage"></div>
  <div class="do-pot-label"   id="do-pot"></div>
  <div class="do-cards"       id="do-cards"></div>
  <div class="do-pips"        id="do-pips"></div>
  <button id="draw-skip" onclick="skipDraw()">Skip animation</button>
</div>

<div id="mbg" onclick="closeMod()">
  <div id="modal" onclick="event.stopPropagation()">
    <h3>Confirm Redraw</h3>
    <p>This will randomly reassign all 48 teams and reset everyone's points to zero. This cannot be undone.</p>
    <div class="mbtns">
      <button class="mc" onclick="closeMod()">Cancel</button>
      <button class="md" onclick="doDraw()">Yes, Redraw</button>
    </div>
  </div>
</div>

<script>
var URL0 = 'https://hblrggrbwodmkesszckk.supabase.co/rest/v1/';
var KEY  = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhibHJnZ3Jid29kbWtlc3N6Y2trIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA5MTY0NjcsImV4cCI6MjA5NjQ5MjQ2N30.5F-8-D4CfSnmj2jxSlViXL_CBP8a2lDy76J6PJEJymY';

function api(path, method, body) {
  method = method || 'GET';
  var h = { 'apikey': KEY, 'Authorization': 'Bearer ' + KEY, 'Content-Type': 'application/json' };
  if (method === 'POST') h['Prefer'] = 'return=representation';
  var opts = { method: method, headers: h };
  if (body !== undefined) opts.body = JSON.stringify(body);
  return fetch(URL0 + path, opts).then(function(r) {
    return r.text().then(function(txt) {
      if (!r.ok) throw new Error(txt);
      return txt ? JSON.parse(txt) : [];
    });
  });
}

var FC = {
  'United States':'us','Canada':'ca','Mexico':'mx',
  'England':'gb-eng','France':'fr','Spain':'es','Germany':'de','Portugal':'pt',
  'Netherlands':'nl','Belgium':'be','Croatia':'hr','Switzerland':'ch','Austria':'at',
  'Scotland':'gb-sct','Norway':'no','Sweden':'se','Czechia':'cz',
  'Bosnia & Herz.':'ba','Bosnia':'ba',
  'Turkiye':'tr','Turkey':'tr',
  'Argentina':'ar','Brazil':'br','Uruguay':'uy','Colombia':'co','Ecuador':'ec','Paraguay':'py',
  'Morocco':'ma','Senegal':'sn','Egypt':'eg','Algeria':'dz','Ghana':'gh',
  'Cote Ivoire':'ci','Ivory Coast':'ci',
  'Tunisia':'tn','South Africa':'za','Cabo Verde':'cv','Cape Verde':'cv',
  'DR Congo':'cd','Serbia':'rs','Poland':'pl','Denmark':'dk',
  'Japan':'jp','South Korea':'kr','Korea Republic':'kr','Iran':'ir','Saudi Arabia':'sa',
  'Australia':'au','Qatar':'qa','Jordan':'jo','Uzbekistan':'uz','Iraq':'iq',
  'Panama':'pa','Honduras':'hn','Jamaica':'jm','New Zealand':'nz',
  'United States':'us','USA':'us','Costa Rica':'cr','Slovakia':'sk',
  'Cameroon':'cm','Haiti':'ht'
};

function flagCode(name) {
  if (!name) return null;
  var n = name.trim();
  if (FC[n]) return FC[n];
  for (var k in FC) {
    if (k.toLowerCase() === n.toLowerCase()) return FC[k];
  }
  return null;
}

function flagImg(name, size) {
  size = size || 20;
  var code = flagCode(name);
  if (!code) return '';
  var url = 'https://flagcdn.com/w' + (size * 2) + '/' + code + '.png';
  return '<img src="' + url + '" width="' + size + '" height="' + Math.round(size*0.75) + '" '
       + 'style="border-radius:2px;vertical-align:middle;object-fit:cover;display:inline-block" '
       + 'alt="" loading="lazy" onerror="this.style.display=\'none\'">';
}

var CC = {Host:'#fbbf24',UEFA:'#60a5fa',CONMEBOL:'#34d399',CAF:'#f87171',AFC:'#c084fc',CONCACAF:'#fb923c',OFC:'#22d3ee'};

var STAGES = [
  {key:'group', label:'Group',  pts:1,  icon:'&#127903;'},
  {key:'r16',   label:'Rd 16',  pts:2,  icon:'&#9876;'},
  {key:'qf',    label:'QF',     pts:3,  icon:'&#128293;'},
  {key:'sf',    label:'SF',     pts:5,  icon:'&#11088;'},
  {key:'final', label:'Final',  pts:8,  icon:'&#129352;'},
  {key:'winner',label:'Winner', pts:13, icon:'&#127942;'}
];

var MEDALS = ['&#129351;','&#129352;','&#129353;'];
function ord(n){ return n===1?'1st':n===2?'2nd':n===3?'3rd':n+'th'; }

var PP=[], TT=[], PK=[], PR=[];
var curView='lb', epid=null, busy=false;

function setStatus(s, txt) {
  document.getElementById('sdot').className = 'dot ' + s;
  var el = document.getElementById('stxt');
  el.textContent = txt;
  el.style.color = s==='live' ? '#34d399' : s==='err' ? '#f87171' : '#fbbf24';
}

function load() {
  setStatus('sync','Loading...');
  Promise.all([
    api('participants?order=name'),
    api('teams?order=name'),
    api('draft_picks?select=*'),
    api('team_progress?select=*')
  ]).then(function(results) {
    PP = results[0]; TT = results[1]; PK = results[2]; PR = results[3];
    setStatus('live','Live');
    renderAll();
  }).catch(function(e) {
    setStatus('err','Connection failed');
    document.getElementById('lb').innerHTML = '<div class="empty"><p>Could not reach database.</p></div>';
  });
}

setInterval(function() {
  if (busy) return;
  Promise.all([api('draft_picks?select=*'), api('team_progress?select=*')]).then(function(r) {
    PK = r[0]; PR = r[1];
    setStatus('live','Live');
    renderLB();
    if (curView==='res' && epid) renderDetail(epid);
    if (curView==='draw') renderDraw();
  }).catch(function() { setStatus('err','Sync error'); });
}, 20000);

function byId(arr,id){ for(var i=0;i<arr.length;i++) if(arr[i].id===id) return arr[i]; return null; }
function picksFor(pid){ return PK.filter(function(p){ return p.participant_id===pid; }); }
function progFor(tid){ return PR.filter(function(p){ return p.team_id===tid; }).map(function(p){ return p.stage_key; }); }
function tpts(tid){ var r=progFor(tid); return STAGES.reduce(function(s,st){ return s+(r.indexOf(st.key)>=0?st.pts:0); },0); }
function ppts(pid){ return picksFor(pid).reduce(function(s,pk){ return s+tpts(pk.team_id); },0); }
function shuf(a){ var b=a.slice(); for(var i=b.length-1;i>0;i--){ var j=0|Math.random()*(i+1); var t=b[i];b[i]=b[j];b[j]=t; } return b; }

function getLB() {
  var s = PP.map(function(p){ return {id:p.id,name:p.name,pts:ppts(p.id)}; });
  s.sort(function(a,b){ return b.pts-a.pts; });
  var rank=1;
  return s.map(function(p,i){ if(i>0&&s[i].pts<s[i-1].pts) rank=i+1; return {id:p.id,name:p.name,pts:p.pts,rank:rank}; });
}

var _tt;
function toast(msg){
  var el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('on');
  clearTimeout(_tt); _tt=setTimeout(function(){ el.classList.remove('on'); },3000);
}

function go(v) {
  curView=v; if(v!=='res') epid=null;
  document.querySelectorAll('.view').forEach(function(el){ el.classList.remove('on'); });
  document.getElementById('view-'+v).classList.add('on');
  document.querySelectorAll('.nb').forEach(function(b){ b.classList.toggle('on', b.dataset.v===v); });
  renderAll();
}

function askDraw(){ PK.length ? document.getElementById('mbg').classList.add('on') : doDraw(); }
function closeMod(){ document.getElementById('mbg').classList.remove('on'); }

var POT_ORDER = [
  'Spain','Argentina','France','England','Brazil','Portugal',
  'Netherlands','Belgium','Germany','Croatia','Morocco','Colombia',
  'USA','United States','Mexico','Uruguay','Japan','Switzerland',
  'Denmark','Senegal','Austria','Iran','South Korea','Ecuador',
  'Algeria','Egypt','Norway','Serbia','Czechia','Scotland',
  'Turkiye','Poland','Cote Ivoire','Tunisia','Canada','Paraguay',
  'South Africa','Ghana','Qatar','Saudi Arabia','Uzbekistan','DR Congo',
  'Panama','Costa Rica','Slovakia','Cameroon','New Zealand','Haiti'
];

function getPots(teams) {
  var sorted = teams.slice().sort(function(a,b){
    var ai=POT_ORDER.indexOf(a.name), bi=POT_ORDER.indexOf(b.name);
    if(ai<0) ai=999; if(bi<0) bi=999;
    return ai-bi;
  });
  var n = Math.ceil(sorted.length/4);
  return [sorted.slice(0,n), sorted.slice(n,n*2), sorted.slice(n*2,n*3), sorted.slice(n*3)];
}

var _skipDraw=false, _drawResolve=null;
function skipDraw(){ _skipDraw=true; if(_drawResolve) _drawResolve(); }
function wait(ms){
  if(_skipDraw) return Promise.resolve();
  return new Promise(function(res){ _drawResolve=res; setTimeout(res,ms); });
}

function doDraw() {
  closeMod(); busy=true; _skipDraw=false; _drawResolve=null;
  setStatus('sync','Drawing...');
  var btn=document.getElementById('draw-btn');
  if(btn){ btn.disabled=true; btn.textContent='Drawing...'; }

  api('team_progress?id=gt.0','DELETE')
  .then(function(){ return api('draft_picks?id=gt.0','DELETE'); })
  .then(function() {
    var pots = getPots(TT);
    var potNames  = ['Pot 1 - Elite','Pot 2 - Strong','Pot 3 - Mid','Pot 4 - Underdogs'];
    var potColors = ['#fde68a','#e5e7eb','#fed7aa','#bfdbfe'];
    var potCls    = ['r1','r2','r3','r4'];

    var drawOrder = shuf(PP.slice());
    var assignments = {};
    PP.forEach(function(p){ assignments[p.id]=[]; });
    var ins = [];

    for(var pi=0; pi<4; pi++) {
      var pt = shuf(pots[pi].slice());
      drawOrder.forEach(function(p,i){
        var team = pt[i % pt.length];
        assignments[p.id].push(team);
        ins.push({participant_id:p.id, team_id:team.id, is_bonus:false});
      });
    }

    var overlay = document.getElementById('draw-overlay');
    var stageEl = document.getElementById('do-stage');
    var potEl   = document.getElementById('do-pot');
    var cardsEl = document.getElementById('do-cards');
    var pipsEl  = document.getElementById('do-pips');

    pipsEl.innerHTML = '';
    for(var q=0;q<4;q++){
      var pip=document.createElement('div');
      pip.className='pip'; pip.id='pip'+q;
      pipsEl.appendChild(pip);
    }
    overlay.classList.add('on');

    var potIdx = 0;
    function drawPot() {
      if(potIdx >= 4) {
        return wait(800).then(function(){
          overlay.classList.remove('on');
          return api('draft_picks','POST',ins);
        }).then(function(saved){
          PK=saved; PR=[];
          setStatus('live','Live');
          toast('Draw complete - good luck everyone!');
          renderAll();
          busy=false;
        });
      }
      var pot=potIdx++;
      document.getElementById('pip'+pot).className='pip active';
      stageEl.textContent = potNames[pot];
      potEl.innerHTML = '<span style="color:'+potColors[pot]+'">'+potNames[pot]+'</span>';

      var cardHtml='';
      drawOrder.forEach(function(p){
        var nm=p.name.split(' ');
        cardHtml += '<div class="dpc" id="dpc'+p.id+'">'
          +'<div class="dpn">'+nm[0]+'<br><span style="font-weight:500;opacity:0.6">'+nm.slice(1).join(' ')+'</span></div>'
          +'<div class="dpt" id="dpt'+p.id+'">?</div>'
          +'</div>';
      });
      cardsEl.innerHTML = cardHtml;

      return wait(500).then(function revealNext(di) {
        di = di || 0;
        if(di >= drawOrder.length) {
          return wait(_skipDraw?0:1000).then(function(){
            document.getElementById('pip'+pot).className='pip done';
            return drawPot();
          });
        }
        var person=drawOrder[di];
        var team=assignments[person.id][pot];
        var card=document.getElementById('dpc'+person.id);
        var teamEl=document.getElementById('dpt'+person.id);
        if(card && teamEl){
          teamEl.innerHTML = flagImg(team.name,16)+' '+team.name;
          card.className='dpc '+potCls[pot];
        }
        return wait(_skipDraw?0:320).then(function(){ return revealNext(di+1); });
      });
    }

    return drawPot();
  }).catch(function(e){
    document.getElementById('draw-overlay').classList.remove('on');
    setStatus('err','Draw failed');
    toast('Draw failed: '+e.message.slice(0,80));
    busy=false;
  });
}

function toggleStage(tid, sk) {
  var si=-1;
  for(var i=0;i<STAGES.length;i++) if(STAGES[i].key===sk){ si=i; break; }
  if(si<0) return;
  var stage=STAGES[si];
  var reached=progFor(tid);
  var isOn=reached.indexOf(sk)>=0;
  document.querySelectorAll('.stbtn-'+tid).forEach(function(b){ b.disabled=true; });

  var toAdd=[], toRemove=[];
  if(!isOn){ for(var j=0;j<=si;j++) if(reached.indexOf(STAGES[j].key)<0) toAdd.push({team_id:tid,stage_key:STAGES[j].key}); }
  else      { for(var k=si;k<STAGES.length;k++) toRemove.push(STAGES[k].key); }

  var p;
  if(toAdd.length){
    p = api('team_progress','POST',toAdd).then(function(added){
      PR=PR.concat(added);
      toast((byId(TT,tid)||{name:'?'}).name+' +'+stage.pts+'pt');
    });
  } else if(toRemove.length){
    p = api('team_progress?team_id=eq.'+tid+'&stage_key=in.('+toRemove.join(',')+')', 'DELETE').then(function(){
      PR=PR.filter(function(x){ return !(x.team_id===tid && toRemove.indexOf(x.stage_key)>=0); });
    });
  } else { p=Promise.resolve(); }

  p.then(function(){
    renderStages(tid);
    var pts=tpts(tid);
    var el=document.getElementById('tp'+tid);
    if(el){ el.textContent=pts+'pt'; el.className='tcpts'+(pts>0?' on':''); }
    if(epid){ var sub=document.getElementById('psub'); if(sub) sub.textContent=ppts(epid)+' pts total'; }
    renderLB();
  }).catch(function(e){ toast('Save failed: '+e.message.slice(0,60)); })
  .finally(function(){ document.querySelectorAll('.stbtn-'+tid).forEach(function(b){ b.disabled=false; }); });
}

function renderStages(tid) {
  var el=document.getElementById('sg'+tid); if(!el) return;
  var reached=progFor(tid), html='';
  for(var i=0;i<STAGES.length;i++){
    var s=STAGES[i], on=reached.indexOf(s.key)>=0;
    html+='<button class="sb'+(on?' on':'')+' stbtn-'+tid+'" onclick="toggleStage('+tid+',\''+s.key+'\')">'
         +'<span class="sbi">'+s.icon+'</span><span class="sbl">'+s.label+'</span><span class="sbp">+'+s.pts+'pt</span></button>';
  }
  el.innerHTML=html;
}

function renderLB() {
  var el=document.getElementById('lb'); if(!el) return;
  if(!PK.length){
    el.innerHTML='<div class="empty"><p>No draw yet - go to the Draw tab!</p><button class="btn btn-blue" onclick="go(\'draw\')">Go to Draw</button></div>';
    return;
  }
  var rows=getLB();
  var h='<div class="ph"><span class="pt">Standings</span><span class="ps">'+PP.length+' players &middot; '+TT.length+' teams</span></div><div class="grid">';
  for(var i=0;i<rows.length;i++){
    var p=rows[i], picks=picksFor(p.id);
    var flags='';
    for(var j=0;j<picks.length;j++){
      var t=byId(TT,picks[j].team_id); if(!t) continue;
      flags+='<span class="fpill">'+flagImg(t.name,15)+' '+t.name+'</span>';
    }
    var rk=p.rank<=3?'<div class="lbrank"><span class="lbmed">'+MEDALS[p.rank-1]+'</span></div>'
                     :'<div class="lbrank"><span class="lbpos">'+ord(p.rank)+'</span></div>';
    var parts=p.name.split(' '), first=parts[0], last=parts.slice(1).join(' ');
    h+='<div class="card'+(p.rank===1&&p.pts>0?' top':'')+' anim" style="animation-delay:'+(i*0.035)+'s">'
      +'<div class="lbr" onclick="goTo('+p.id+')">'
      +rk
      +'<div class="lbbody"><div class="lbname">'+first+' <span>'+last+'</span></div><div class="lbflags">'+flags+'</div></div>'
      +'<div class="lbr-right"><div class="lbpts'+(p.pts>0?' on':'')+'">'+p.pts+'</div><div class="lbptsl">pts</div></div>'
      +'<div class="lbchev">&#8250;</div>'
      +'</div></div>';
  }
  h+='</div><div class="pk"><div class="pkt">Points per stage</div><div class="pkg">';
  for(var s=0;s<STAGES.length;s++){
    h+='<div class="pki"><span class="pkii">'+STAGES[s].icon+'</span><span class="pkip">'+STAGES[s].pts+'pt</span><span class="pkil">'+STAGES[s].label+'</span></div>';
  }
  h+='</div></div>';
  el.innerHTML=h;
}

function goTo(id){ epid=id; go('res'); }

function renderRes() {
  var el=document.getElementById('res'); if(!el) return;
  if(!PK.length){
    el.innerHTML='<div class="empty"><p>Run the draw first!</p><button class="btn btn-blue" onclick="go(\'draw\')">Go to Draw</button></div>';
    return;
  }
  if(!epid){
    var rows=getLB();
    var h='<div class="ph"><span class="pt">Update Results</span></div><p style="font-size:0.88rem;color:rgba(255,255,255,0.55);margin-bottom:1rem">Select a player to update their teams progress.</p>';
    for(var i=0;i<rows.length;i++){
      var p=rows[i];
      h+='<button class="psnbtn" onclick="goTo('+p.id+')">'+p.name+'<span class="psnpts">'+p.pts+' pts &#8250;</span></button>';
    }
    el.innerHTML=h; return;
  }
  renderDetail(epid);
}

function renderDetail(pid) {
  var el=document.getElementById('res'); if(!el) return;
  var person=byId(PP,pid); if(!person){ epid=null; renderRes(); return; }
  var picks=picksFor(pid), total=ppts(pid);
  var h='<div class="psnhdr"><button class="back" onclick="epid=null;renderRes()">&#8592; Back</button>'
       +'<div><div class="psnname">'+person.name+'</div><div class="psnsub" id="psub">'+total+' pts total &middot; '+picks.length+' teams</div></div></div>';
  for(var i=0;i<picks.length;i++){
    var pk=picks[i], t=byId(TT,pk.team_id); if(!t) continue;
    var pts=tpts(t.id), conf=t.confederation||'';
    h+='<div class="tc"><div class="tctop">'
      +'<span class="tcflag">'+flagImg(t.name,36)+'</span>'
      +'<div class="tcinfo"><div class="tcname">'+t.name+(pk.is_bonus?'<span class="bonus">Bonus</span>':'')+'</div>'
      +'<div class="tcconf" style="color:'+(CC[conf]||'rgba(255,255,255,0.55)')+'">'+conf+'</div></div>'
      +'<div id="tp'+t.id+'" class="tcpts'+(pts>0?' on':'')+'">'+pts+'pt</div>'
      +'</div><div id="sg'+t.id+'" class="sgrid"></div></div>';
  }
  el.innerHTML=h;
  for(var j=0;j<picks.length;j++) renderStages(picks[j].team_id);
}

function renderDraw() {
  var el=document.getElementById('drw'); if(!el) return;
  var pots=getPots(TT);
  var potCfg=[
    {label:'Pot 1 - Elite',     cls:'p1', icon:'&#129351;', desc:'World\'s best - one guaranteed per player'},
    {label:'Pot 2 - Strong',    cls:'p2', icon:'&#129352;', desc:'Contenders - one guaranteed per player'},
    {label:'Pot 3 - Mid',       cls:'p3', icon:'&#129353;', desc:'Dark horses - one guaranteed per player'},
    {label:'Pot 4 - Underdogs', cls:'p4', icon:'&#127919;', desc:'Wildcards - one guaranteed per player'},
  ];
  var h='<div class="ph"><span class="pt">The Draw</span></div>'
       +'<div class="info"><strong>Seeded draw:</strong> Teams ranked into 4 pots. Every player draws one team from each pot - guaranteed one elite, one contender, one dark horse, one underdog. Fair for everyone.</div>'
       +'<div class="brow"><button id="draw-btn" class="btn btn-blue" onclick="askDraw()">'+(PK.length?'&#x1F504; Redraw':'&#127922; Run the Draw')+'</button>'
       +(PK.length?'<button class="btn btn-ghost" onclick="go(\'res\')">Update Results</button>':'')
       +'</div>';

  for(var i=0;i<4;i++){
    h+='<div class="pot-section"><div class="pot-hdr '+potCfg[i].cls+'">'
      +'<span class="pot-icon">'+potCfg[i].icon+'</span>'
      +'<div><h3>'+potCfg[i].label+'</h3><p>'+potCfg[i].desc+'</p></div>'
      +'</div><div class="pot-teams">';
    for(var j=0;j<pots[i].length;j++){
      var t=pots[i][j];
      h+='<div class="pot-team">'+flagImg(t.name,16)+' '+t.name+'</div>';
    }
    h+='</div></div>';
  }

  if(PK.length){
    h+='<div class="ph" style="margin-top:1.5rem"><span class="pt">Current Draw</span></div><div class="grid">';
    for(var pi=0;pi<PP.length;pi++){
      var person=PP[pi], ppicks=picksFor(person.id), ppts2=ppts(person.id);
      h+='<div class="dc"><div class="dch"><span class="dcn">'+person.name+'</span><span class="dcp">'+ppts2+' pts</span></div><div class="pills">';
      for(var pj=0;pj<ppicks.length;pj++){
        var pt=byId(TT,ppicks[pj].team_id);
        if(pt) h+='<span class="pill">'+flagImg(pt.name,16)+' '+pt.name+'</span>';
      }
      h+='</div></div>';
    }
    h+='</div>';
  }
  el.innerHTML=h;
}

function renderAll(){ renderLB(); if(curView==='res') renderRes(); if(curView==='draw') renderDraw(); }

load();
</script>
